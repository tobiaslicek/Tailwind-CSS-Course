<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Colors</title>
  </head>
  <body>
    <!-- Default colors -->
    <!-- white, black, red, green, blue, orange, yellow, purple, lime, emerald, teal, cyan, indigo, violet, fuchsia, pink, rose, sky, gray, slate, zinc, neutral, stone, amber,  -->

    <!-- Text Colors -->
    <p class="text-black">Tailwind</p>
    <p class="text-white bg-gray-600">Tailwind</p>
    <p class="text-red-500">Tailwind</p>
    <p class="text-emerald-500">Tailwind</p>
    <p class="text-zinc-500">Tailwind</p>
    <p class="text-slate-500">Tailwind</p>

    <!-- Background Colors -->
    <p class="bg-emerald-500">Tailwind</p>
    <p class="bg-blue-800 text-yellow-500">Tailwind</p>

    <!-- Text Underline -->
    <p class="udnerline decoration-red-500">Tailwind</p>

    <!-- Border Colors -->
    <input type="text" class="border border-blue-200" />

    <!-- Divide Colors -->
    <div class="divide-y divide-blue-500">
      <div>Item 1</div>
      <div>Item 2</div>
      <div>Item 3</div>
      <div>Item 4</div>
      <div>Item 5</div>
    </div>

    <!-- Outline Colors -->
    <button class="outline">Tailwind</button>
    <button class="outline-blue-200">Tailwind</button>

    <!-- Box Shadow Colors (Opacity defaults to 100, but you can set it)-->
    <button class="shadow-lg bg-cyan-500 shadow-cyan-500">Subscribe</button>

    <!-- Accent Colors -->
    <input type="checkbox" class="accent-purple-500" checked /> Option 1
    <input type="checkbox" class="accent-pink-500" checked /> Option 2
    <input type="checkbox" class="accent-red-300" checked /> Option 3

    <!-- Arbitrary Colors -->
    <div class="bg-[#427fab] h-10">Hello</div>
    <div class="text-[#427fab] h-10">Hello</div>
    <div class="border border-[#427fab] h-10">Hello</div>
  </body>
</html>
